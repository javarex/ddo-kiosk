<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Print Page</title>
    <link rel="stylesheet" href="../../dist/print.css" />
    <script src="../../dist/print-bundle.js"></script>
</head>

<body>
    <main class="receipt">
        <section class="receipt-header">
            <p class="receipt-label">Queue Number</p>
            <div class="ticket-number" id="ticket-no"></div>
            <div class="ticket-priority" id="ticket-priority"></div>
            <div class="ticket-service" id="ticket-service"></div>
        </section>

        <section class="receipt-details" aria-label="Ticket details">
            <div class="detail-row">
                <span class="detail-label">Date</span>
                <span class="detail-value" id="ticket-date"></span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Office</span>
                <span class="detail-value" id="office"></span>
            </div>
            <div class="detail-row is-hidden">
                <span class="detail-label">Location</span>
                <span class="detail-value" id="location"></span>
            </div>
        </section>

        <section class="receipt-footer">
            <div class="footer-rule"></div>
            <p>Please wait for your number to be called.</p>
            <p>Thank you.</p>
        </section>
    </main>
</body>

</html>
